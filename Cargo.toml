[workspace]
resolver = "2"
members = [
    "llama-cpp-sys-4",
    "llama-cpp-4",
    "examples/embeddings",
    "examples/simple",
    "examples/chat",
    "examples/split_model",
    "examples/server",
    "examples/mtmd",
    "examples/structured",
    "examples/tokenize",
    "examples/batched-bench",
    "examples/perplexity",
    "examples/quantize",
    "examples/fit-params",
    "examples/export-lora",
    "examples/imatrix",
    "examples/cvector-generator",
    "examples/tts",
    "examples/turbo-quant",
    "examples/incremental-chat",
    "examples/mtp",
    "examples/ngram",
    "examples/eagle",
    "examples/wasm",
    "android/llama-jni",
]

[workspace.dependencies]
# core library deps
thiserror = "2.0.18"
tracing = "0.1"

# examples and benchmarks
hf-hub = { version = "=1.0.0", features = ["blocking"] }
criterion = "0.8.2"
pprof = "0.15.0"
bindgen = "0.73.2"
cc = "1.2.63"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
encoding_rs = "0.8.35"

[workspace.lints.rust]
missing_docs = { level = "warn" }
missing_debug_implementations = { level = "warn" }

[workspace.lints.clippy]
# Priority -1 so the explicit lint below can override the group; Cargo requires
# a group to be ordered relative to any individual lint it contains.
pedantic = { level = "warn", priority = -1 }

# `undocumented_unsafe_blocks` is the lint that matters most for an FFI crate,
# and it is deliberately *not* enabled workspace-wide yet: there are ~1100
# `unsafe` blocks and only a fraction carry a `SAFETY:` comment, so switching it
# on globally would mean a thousand warnings (and, with CI's `-D warnings`, a
# red build) that nobody can action in one change.
#
# It is being adopted as a ratchet instead. A module whose `unsafe` blocks are
# all justified gets, at the top of the file:
#
#     #![deny(clippy::undocumented_unsafe_blocks)]
#
# which makes that module's coverage permanent — a new undocumented block there
# fails the build. Done so far: `context/tensor_transaction.rs`, `cfile.rs`,
# `llama_backend.rs`, `llama_batch.rs`, `llama_batch_ext.rs`. The remaining
# large ones, worst first: `model.rs`, `mtmd.rs`, `context.rs`, `ggml.rs`,
# `sampling.rs`.
#
# Once every module carries it, move the lint here at `deny` and delete the
# per-module attributes.
#
# A `SAFETY:` comment earns its place by naming the precondition and why it
# holds *here* — "calls into C" is not a justification. `tensor_transaction.rs`
# is the reference for the standard.
undocumented_unsafe_blocks = { level = "allow", priority = 0 }
