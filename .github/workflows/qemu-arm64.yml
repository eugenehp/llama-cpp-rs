name: QEMU arm64 smoke

# Cross-compiles the `llama-jni` smoke binary for aarch64-unknown-linux-gnu and
# runs it under qemu-user against the tiny stories260K model. This exercises the
# real arm64 llama.cpp libraries end-to-end (load + greedy decode) on x86 CI,
# guarding the arm64 code path (see issue #306) without native arm64 hardware.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-aarch64:
    name: aarch64-linux-gnu smoke (QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET: aarch64-unknown-linux-gnu
      # Cross toolchain for the C/C++ (llama.cpp via cmake/cc) and the Rust link.
      CC_aarch64-unknown-linux-gnu: aarch64-linux-gnu-gcc
      CXX_aarch64-unknown-linux-gnu: aarch64-linux-gnu-g++
      AR_aarch64-unknown-linux-gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      # qemu-user sysroot: aarch64 dynamic loader + libc/libstdc++ live here.
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install cross toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake git libclang-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            qemu-user qemu-user-static

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"
          shared-key: qemu-aarch64-smoke-v1
          cache-on-failure: false

      - name: Fetch tiny test model
        run: ./scripts/fetch-test-model.sh

      - name: Build smoke binary (aarch64-unknown-linux-gnu)
        run: cargo build -p llama-jni --bin smoke --release --target "${TARGET}"

      - name: Confirm it is an arm64 ELF
        run: |
          BIN="target/${TARGET}/release/smoke"
          file "$BIN"
          file "$BIN" | grep -q "ARM aarch64" || {
            echo "::error::smoke is not an aarch64 binary"; exit 1; }

      - name: Run smoke under QEMU (aarch64)
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/smoke"
          MODEL="$PWD/target/test-models/stories260K.gguf"
          echo "::group::qemu-aarch64 run"
          LLAMA_TEST_MODEL="$MODEL" \
            qemu-aarch64 -L "$QEMU_LD_PREFIX" "$BIN" "Once upon a time" \
            | tee smoke-output.txt
          echo "::endgroup::"
          grep -q "SMOKE OK" smoke-output.txt || {
            echo "::error::QEMU smoke test did not report SMOKE OK"; exit 1; }
