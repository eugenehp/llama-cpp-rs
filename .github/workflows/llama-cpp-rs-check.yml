name: Llama Cpp Rs Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  check:
    name: Run tests on llama-cpp-rs
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # `RUSTFLAGS` replaces .cargo/config.toml rustflags rather than appending,
      # so the $ORIGIN rpath that lets directly executed binaries find the
      # llama.cpp shared libraries must be repeated here.
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold -C link-arg=-Wl,-rpath,$ORIGIN'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      # Seconds, and before anything compiles. A bad bindgen/prettyplease
      # pairing otherwise fails ~20 minutes in, inside bindgen's own source,
      # with nothing pointing at the lockfile as the cause.
      - name: Check the bindgen/syn pairing
        run: ./scripts/check-bindgen-syn.sh
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential curl libssl-dev libclang-dev pkg-config cmake git mold
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `cargo fmt` on its own rewrites files in the runner and always exits 0,
      # so it never gated anything. `--check` reports and fails instead.
      - name: Fmt
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --exclude openai-server --exclude llama-jni
      - name: sccache stats
        run: sccache --show-stats || true
  linux:
    name: Check that it builds on linux (native)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # `RUSTFLAGS` replaces .cargo/config.toml rustflags rather than appending,
      # so the $ORIGIN rpath that lets directly executed binaries find the
      # llama.cpp shared libraries must be repeated here.
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold -C link-arg=-Wl,-rpath,$ORIGIN'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential curl libssl-dev libclang-dev pkg-config cmake git mold
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --all-targets --exclude llama-jni
      # `cargo run` and `cargo test` set LD_LIBRARY_PATH to the target directory,
      # so they cannot catch a missing rpath — only running the binary directly
      # exercises how a user (or a shipped artifact) actually loads the
      # llama.cpp shared libraries.
      - name: Verify a dynamically linked binary runs without cargo
        run: |
          output=$(./target/debug/simple --help 2>&1)
          echo "$output" | head -5
          if echo "$output" | grep -qiE 'error while loading shared libraries|cannot open shared object|no such file or directory'; then
            echo "::error::binary could not locate the llama.cpp shared libraries — is the \$ORIGIN rpath still applied?"
            exit 1
          fi
      - name: sccache stats
        run: sccache --show-stats || true
  msrv:
    # `rust-version` in llama-cpp-4/Cargo.toml and llama-cpp-sys-4/Cargo.toml is
    # a promise to consumers, and nothing else here checks it: every other job
    # runs `stable`, so the day someone uses a newer language or std feature the
    # declared floor silently becomes a lie and downstream gets a syntax error
    # instead of "requires rustc X".
    #
    # Only the two published crates are built. The examples pull dependencies
    # with much higher floors (actix-web, sysinfo, hf-hub) and are not published,
    # so holding them to the library's MSRV would be meaningless.
    name: Build at the declared MSRV
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml, which pins the *development* toolchain.
      RUSTUP_TOOLCHAIN: "1.88"
      RUSTFLAGS: '-C link-arg=-Wl,-rpath,$ORIGIN'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential curl libssl-dev libclang-dev pkg-config cmake git
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      # Read the floor out of the manifest rather than repeating it, so the two
      # cannot drift apart.
      - name: Check the job matches the declared rust-version
        run: |
          declared=$(awk -F'"' '/^rust-version/ {print $2; exit}' llama-cpp-4/Cargo.toml)
          if [ "$declared" != "$RUSTUP_TOOLCHAIN" ]; then
            echo "::error::llama-cpp-4 declares rust-version $declared but this job pins $RUSTUP_TOOLCHAIN"
            exit 1
          fi
          test "$(awk -F'"' '/^rust-version/ {print $2; exit}' llama-cpp-sys-4/Cargo.toml)" = "$declared" \
            || { echo "::error::the two crates declare different rust-version values"; exit 1; }
      - name: Build the published crates at the MSRV
        run: cargo build -p llama-cpp-4 -p llama-cpp-sys-4

  supply-chain:
    # Nothing checked advisories or licences before. `llama-cpp-sys-4` runs
    # `ureq` + `rustls` inside its build script, and the examples pull actix-web,
    # reqwest and hf-hub, so the graph is big enough to hide a vulnerable
    # transitive dependency — one was hiding in it (see `deny.toml`).
    #
    # No llama.cpp build: cargo-deny reads the manifests and lockfile, so this
    # is the cheapest job here and gives the fastest signal.
    name: Advisories, licences and sources
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check
      # `deny.toml` carries a dated exception for an advisory that cannot be
      # fixed from here. Surface when an entry has outlived its reason rather
      # than letting it become permanent.
      - name: Report ignored advisories
        if: always()
        run: |
          echo "Advisories currently ignored (review these):"
          grep -n 'id = "RUSTSEC' deny.toml || echo "  none"

  semver:
    # `llama-cpp-4` tracks a fast-moving upstream, and 0.8.0 shipped a
    # deliberate set of breaking changes. Nothing verified that a *patch*
    # release does not do the same by accident — which for a 0.x crate is what
    # semver forbids.
    #
    # Non-blocking: the baseline is the published crate, so this cannot run
    # before the first publish of a new minor, and a rustdoc-JSON mismatch
    # should not hold up a merge.
    name: Check API compatibility against the published crate
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTFLAGS: '-C link-arg=-Wl,-rpath,$ORIGIN'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential curl libssl-dev libclang-dev pkg-config cmake git
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # `--release-type` is deliberately omitted: cargo-semver-checks then reads
      # the version in Cargo.toml and applies 0.x rules, where a breaking change
      # requires a minor bump. A minor bump with breaks passes; a patch bump with
      # breaks fails, which is the case worth catching.
      - name: cargo semver-checks
        run: cargo semver-checks check-release -p llama-cpp-4

  package:
    # Builds the crate exactly as crates.io would receive it and compiles that
    # tree. Nothing else checks the published artifact: the workspace builds
    # from the git checkout, which has files the `include` list in
    # llama-cpp-sys-4/Cargo.toml does not ship. A llama.cpp bump that starts
    # requiring a new file type — `ggml-version.h.in` did, in upstream #28364 —
    # breaks the published crate while every other job stays green.
    #
    # Only llama-cpp-sys-4 can be verified here: llama-cpp-4 depends on it by
    # version, so `cargo package` cannot resolve until the sys crate is on
    # crates.io.
    name: Verify the publishable package builds
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold -C link-arg=-Wl,-rpath,$ORIGIN'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential curl libssl-dev libclang-dev pkg-config cmake git mold
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
      # `--allow-dirty` because the submodule checkout leaves the tree dirty in
      # CI; the packaging and verification are what matter here, not cleanliness.
      - name: cargo package (with verification build)
        run: cargo package -p llama-cpp-sys-4 --allow-dirty
      - name: sccache stats
        run: sccache --show-stats || true

  feature-combos:
    # Every other job builds the default feature set
    # (openmp,mtmd,dynamic-link), so a break under any other combination stays
    # hidden until a release tag fires prebuilt-llama.yml.
    #
    # These jobs *lint* as well as build. `ggml` had accumulated 47 clippy
    # warnings precisely because nothing here ever turned the feature on — code
    # behind an off-by-default feature is not covered by the default-feature
    # jobs, so it drifts silently.
    name: Check non-default feature combos (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: static + mtmd
            features: mtmd
          - label: rpc
            features: rpc
          # Raw ggml tensor/graph API. Off by default, so only this job sees it.
          - label: ggml
            features: ggml
          # Q1 quantization; gates a build-time patch as well as Rust code.
          - label: q1
            features: q1
          # BLAS was in the same position metal was: built only by
          # prebuilt-llama.yml on a `v*` tag. It is the one remaining backend
          # that needs nothing but an apt package, so it belongs on the gate.
          - label: blas
            features: blas
            apt: libopenblas-dev
          # No features at all: static linkage, no mtmd/openmp. The floor every
          # other combination builds on.
          - label: no-default-features
            features: ""
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # `RUSTFLAGS` replaces .cargo/config.toml rustflags rather than appending,
      # so the $ORIGIN rpath that lets directly executed binaries find the
      # llama.cpp shared libraries must be repeated here.
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold -C link-arg=-Wl,-rpath,$ORIGIN'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential curl libssl-dev libclang-dev pkg-config cmake git mold ${{ matrix.apt }}
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build -p llama-cpp-4 --no-default-features
          else
            cargo build -p llama-cpp-4 --no-default-features --features ${{ matrix.features }}
          fi
      # Lint too, not just build. A feature-gated module that compiles can still
      # be accumulating warnings nobody sees.
      - name: Clippy
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo clippy -p llama-cpp-4 --all-targets --no-default-features -- -D warnings
          else
            cargo clippy -p llama-cpp-4 --all-targets --no-default-features \
              --features ${{ matrix.features }} -- -D warnings
          fi
      # `ggml` and `q1` carry their own test files, which nothing else runs.
      - name: Test
        if: matrix.features == 'ggml' || matrix.features == 'q1'
        run: cargo test -p llama-cpp-4 --no-default-features --features ${{ matrix.features }}
      # examples/rpc is its own workspace (see its Cargo.toml), so no other job
      # ever compiles it — which is how it silently went stale.
      - name: Build rpc example
        if: matrix.features == 'rpc'
        run: cargo build --manifest-path examples/rpc/Cargo.toml
      - name: sccache stats
        run: sccache --show-stats || true
  mac:
    name: Check that it builds on mac
    runs-on: macos-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --exclude llama-jni
      # Metal is the backend this project leads with on macOS, and it was only
      # ever built by prebuilt-llama.yml — which fires on a `v*` tag. So an
      # upstream ggml-metal change broke the release, not the pull request that
      # pulled it in. The runner is already paid for here.
      - name: Build and lint the metal backend
        run: |
          cargo build -p llama-cpp-4 --no-default-features --features metal
          cargo clippy -p llama-cpp-4 --all-targets --no-default-features --features metal -- -D warnings
      # The `package` job runs on Linux without `metal`, so a tool directory
      # that tools/CMakeLists.txt adds only under GGML_METAL (`tuning`) can be
      # missing from the `include` list while every job stays green — which is
      # how it reached the published 0.8.0. From #346, thanks @tmtiwari.
      # `mtmd` turns on LLAMA_BUILD_TOOLS; `metal` turns on GGML_METAL.
      - name: cargo package, metal + mtmd (with verification build)
        run: cargo package -p llama-cpp-sys-4 --allow-dirty --features metal,mtmd
      - name: sccache stats
        run: sccache --show-stats || true
  windows:
    name: Check that it builds on windows
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Ensure patch.exe is discoverable
        shell: pwsh
        run: |
          $gitUsrBin = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (Test-Path $gitUsrBin) {
            if (-not ($env:PATH -split ';' | Where-Object { $_ -ieq $gitUsrBin })) {
              $gitUsrBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --exclude llama-jni
      - name: Setup Vulkan SDK
        uses: ./.github/actions/setup-vulkan-sdk-windows
      - name: Build Vulkan
        shell: pwsh
        run: cargo build --features vulkan
      - name: Test
        run: cargo test --workspace --exclude openai-server --exclude llama-jni
      - name: sccache stats
        shell: pwsh
        run: sccache --show-stats
  llama-cpp-4-integration:
    name: llama-cpp-4 integration tests (GGUF)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # `RUSTFLAGS` replaces .cargo/config.toml rustflags rather than appending,
      # so the $ORIGIN rpath that lets directly executed binaries find the
      # llama.cpp shared libraries must be repeated here.
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold -C link-arg=-Wl,-rpath,$ORIGIN'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential curl libssl-dev libclang-dev pkg-config cmake git mold
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch test model
        run: ./scripts/fetch-test-model.sh
      - name: Integration tests
        env:
          LLAMA_TEST_MODEL: ${{ github.workspace }}/target/test-models/stories260K.gguf
        run: cargo test -p llama-cpp-4 --test test_integration -- --test-threads=1
      - name: sccache stats
        run: sccache --show-stats || true

  wasm:
    name: Check that it builds and runs as WebAssembly
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake ninja-build git libclang-dev bc
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the channel, so the target has to be added to
      # the toolchain cargo actually resolves to — the action's `targets:` input
      # installs into `stable`, which is not it.
      - name: Add the wasm target to the pinned toolchain
        run: rustup target add wasm32-unknown-emscripten
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache
      - name: Fetch test model
        run: ./scripts/fetch-test-model.sh

      # Catches the mistakes that are invisible from a host build: a feature
      # that cannot work in a browser, a cmake flag the Emscripten toolchain
      # overrides, and bindgen silently emitting no functions.
      - name: Build llama-cpp-sys-4 for wasm
        run: cargo build --target wasm32-unknown-emscripten -p llama-cpp-sys-4 --no-default-features
      - name: Build llama-cpp-4 for wasm
        run: cargo build --target wasm32-unknown-emscripten -p llama-cpp-4 --no-default-features

      # bindgen generates constants and types for wasm but drops every function
      # declaration, and does so without an error — the crate then fails much
      # later with hundreds of unresolved imports. `build.rs` works around it by
      # parsing with a layout-compatible triple; this is the regression test for
      # that workaround still producing a usable binding set.
      - name: Assert the bindings contain functions
        run: |
          set -euo pipefail
          BINDINGS=$(find target/wasm32-unknown-emscripten -name bindings.rs | head -1)
          COUNT=$(grep -c 'pub fn ' "$BINDINGS")
          echo "generated $COUNT function bindings"
          if [[ "$COUNT" -lt 500 ]]; then
            echo "::error::only $COUNT function bindings for wasm (expected >500);" \
                 "bindgen is likely dropping them again"
            exit 1
          fi

      - name: Build the static wasm demo
        run: ./examples/wasm/build.sh

      # The decisive check: the wasm actually loads a GGUF out of MEMFS and
      # decodes, through the same factory/FS/callMain path index.html uses.
      - name: Run inference in wasm
        run: |
          set -euo pipefail
          OUT=$(node target/wasm-dist/harness.cjs \
            target/test-models/stories260K.gguf "Once upon a time" 16)
          echo "$OUT"
          grep -q "Once upon a time" <<<"$OUT"


      # The harness above exercises the wasm module but never the page. This
      # drives a real Chrome over CDP: file:// with the file picker (the
      # no-server claim) and http:// with the bundled-sample button (the hosted
      # demo). Chrome is preinstalled on the GitHub runners.
      - name: Start headless Chrome
        run: |
          google-chrome --headless=new --remote-debugging-port=9222 \
            --user-data-dir=$(mktemp -d) --no-first-run --no-default-browser-check \
            --disable-gpu --no-sandbox about:blank &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
          curl -s http://127.0.0.1:9222/json/version | head -2

      - name: Test in a browser (file://, file picker)
        run: |
          cp target/test-models/stories260K.gguf target/wasm-dist/
          node examples/wasm/browser-test.cjs \
            "file://$PWD/target/wasm-dist/index.html" \
            "$PWD/target/wasm-dist/stories260K.gguf" picker

      - name: Test in a browser (http://, bundled sample)
        run: |
          (cd target/wasm-dist && python3 -m http.server 8731 &) 
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8731/index.html >/dev/null && break; sleep 1; done
          node examples/wasm/browser-test.cjs "http://127.0.0.1:8731/index.html" "" sample

      - name: Upload the demo
        uses: actions/upload-artifact@v7
        with:
          name: wasm-demo
          path: target/wasm-dist/
          if-no-files-found: error

      - name: sccache stats
        run: sccache --show-stats || true
